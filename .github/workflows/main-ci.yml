name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

jobs:
  configuration:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.5'
          python-version-file: .python-version
          enable-cache: 'false'
      - run: uv run --locked python scripts/check.py
      - name: Prepare shared source tools
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@13fcf59d2819c8ba9aaee9da0c1828090f686291
        with:
          capability: security
      - name: Validate the shared source contract
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@13fcf59d2819c8ba9aaee9da0c1828090f686291
        with:
          contract: .github/nddev-ci.toml
          upload: never
