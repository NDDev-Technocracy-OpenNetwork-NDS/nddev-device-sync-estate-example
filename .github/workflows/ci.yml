# The repository's check through the CI library nddev-ci: a pull request runs `just check`
# and `just test`, a push to dev `just verify`, on GitHub's runners (a public repository).
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@7b32292d2be353574bb575524c3129e094ed1104 # v0.6.177
    permissions:
      contents: read
    with:
      submodules: 'true'
      rust-version: 1.100.0
      python-version: 3.15.2
      uv-version: 0.13.9
      rust-components: clippy,rustfmt
